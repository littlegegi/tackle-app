<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tackle</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tackle">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #F1F4F9;
    --surface: #FFFFFF;
    --surface-2: #F6F8FC;
    --ink: #171B26;
    --ink-soft: #5C6478;
    --ink-faint: #9AA2B4;
    --line: #E1E6EF;
    --shadow: rgba(23, 33, 56, 0.09);
    --rose: #C6485C;

    --radius-l: 22px;
    --radius-m: 16px;
    --radius-s: 11px;

    --font-head: 'Manrope', system-ui, sans-serif;
    --font-body: 'Inter', system-ui, sans-serif;
  }

  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #0F1420;
      --surface: #171D2C;
      --surface-2: #1D2436;
      --ink: #ECEFF7;
      --ink-soft: #9CA5BC;
      --ink-faint: #656E85;
      --line: #293146;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1420;
    --surface: #171D2C;
    --surface-2: #1D2436;
    --ink: #ECEFF7;
    --ink-soft: #9CA5BC;
    --ink-faint: #656E85;
    --line: #293146;
    --shadow: rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    justify-content: center;
    position: fixed;
    inset: 0;
    overflow: hidden;
  }
  body.dragging-active { -webkit-user-select: none; user-select: none; }

  button {
    -webkit-appearance: none; appearance: none;
    color: var(--ink); background: none; border: none;
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
  }
  input, select { color: var(--ink); font-family: var(--font-body); -webkit-tap-highlight-color: transparent; }

  #app {
    width: 100%;
    max-width: 520px;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
  }

  header.top { padding: calc(env(safe-area-inset-top, 0px) + 22px) 20px 14px; }
  header.top h1 { font-family: var(--font-head); font-weight: 800; font-size: 26px; margin: 0; letter-spacing: -0.01em; }

  main { flex: 1; padding: 4px 20px 100px; overflow-x: hidden; }

  section.block { margin-bottom: 30px; }
  section.block h2 { font-family: var(--font-head); font-size: 15px; font-weight: 700; margin: 0 0 12px 2px; color: var(--ink); }
  section.block h2 .count { color: var(--ink-faint); font-weight: 600; margin-left: 2px; }

  .bubble { display: flex; align-items: center; justify-content: center; overflow: hidden; background-size: cover; background-position: center; flex: 0 0 auto; }

  .btn { font-size: 14px; font-weight: 600; border-radius: 100px; padding: 10px 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: transform .12s ease; }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: var(--ink); color: var(--bg); }
  .btn-ghost { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
  .btn-small { padding: 7px 12px; font-size: 12.5px; }
  .btn-icon {
    width: 32px; height: 32px; padding: 0; border-radius: 50%;
    background: var(--surface-2); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft); cursor: pointer;
  }
  .btn-icon:active { transform: scale(0.92); }
  .btn-icon.warn { color: var(--rose); }

  .zone { border-radius: var(--radius-l); transition: background-color .15s ease, box-shadow .15s ease; }
  .zone.drop-hover { box-shadow: inset 0 0 0 2px var(--ink); background-color: var(--surface-2); }

  .empty-prio, .empty-state {
    border: 1.5px dashed var(--line);
    border-radius: var(--radius-l);
    padding: 22px 18px;
    text-align: center;
    color: var(--ink-faint);
  }
  .empty-prio p, .empty-state p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ink-soft); }

  /* --- 2-column grid of 4:5 cards --- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    aspect-ratio: 4 / 5;
    padding: 13px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .card.prio { border-width: 2px; }
  .card .bubble { width: 38px; height: 38px; border-radius: 12px; font-size: 19px; margin-bottom: 10px; }
  .card .c-title {
    font-family: var(--font-head); font-weight: 700; font-size: 13.5px; line-height: 1.28;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  .card .c-sub { font-size: 11px; color: var(--ink-soft); font-weight: 500; margin-top: 3px; }
  .card .c-sub.overdue { color: var(--rose); font-weight: 600; }
  .card-actions { display: flex; gap: 6px; margin-top: auto; padding-top: 8px; }

  .drag-handle {
    color: var(--ink-faint);
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
    cursor: grab;
    position: absolute; top: 10px; right: 10px; z-index: 2;
  }

  /* full-bleed photo card */
  .photo-card { padding: 0; justify-content: flex-end; }
  .photo-card .card-photo { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0.84; }
  .photo-card .card-scrim { position: absolute; inset: 0; background: linear-gradient(to top, rgba(6,9,18,0.82) 0%, rgba(6,9,18,0.25) 50%, rgba(6,9,18,0) 80%); }
  .photo-card .card-text { position: relative; z-index: 2; padding: 12px; }
  .photo-card .c-title { color: #fff; -webkit-line-clamp: 2; }
  .photo-card .c-sub { color: rgba(255,255,255,0.82); }
  .photo-card .c-sub.overdue { color: #FFB0BC; }
  .photo-card .card-actions { position: relative; z-index: 2; padding: 0 12px 12px; margin-top: 0; }
  .photo-card .drag-handle { background: rgba(255,255,255,0.22); border-radius: 50%; width: 26px; height: 26px; color: #fff; }
  .photo-card .btn-icon { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.32); color: #fff; }
  .photo-card .btn-icon.warn { color: #FFC9D1; }

  /* --- Done: collapsible history --- */
  .done-toggle {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 2px 12px;
    cursor: pointer;
  }
  .done-toggle .dt-label { font-family: var(--font-head); font-size: 15px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 6px; }
  .done-toggle .dt-label .count { color: var(--ink-faint); font-weight: 600; }
  .done-toggle .chevron { color: var(--ink-faint); transition: transform .2s ease; }
  .done-toggle.open .chevron { transform: rotate(180deg); }
  .done-content { display: none; }
  .done-content.open { display: block; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .list-row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
  .list-row .bubble { width: 40px; height: 40px; border-radius: 12px; font-size: 18px; }
  .list-row .lr-title { font-weight: 600; font-size: 14px; }
  .list-row .lr-sub { font-size: 12px; color: var(--ink-soft); }
  .list-row .lr-main { flex: 1; min-width: 0; }
  .history-date { font-size: 12.5px; font-weight: 700; color: var(--ink-faint); margin: 16px 2px 8px; }
  .history-date:first-child { margin-top: 0; }

  .fab { position: fixed; right: max(20px, calc(50vw - 260px + 20px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 54px; height: 54px; border-radius: 50%; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px var(--shadow); cursor: pointer; z-index: 20; }
  .fab:active { transform: scale(0.94); }

  .sheet-backdrop { position: fixed; inset: 0; background: rgba(10, 14, 24, 0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; opacity: 0; pointer-events: none; transition: opacity .18s ease; }
  .sheet-backdrop.open { opacity: 1; pointer-events: all; }
  .sheet { width: 100%; max-width: 520px; background: var(--surface); border-radius: 24px 24px 0 0; padding: 20px 20px calc(24px + env(safe-area-inset-bottom, 0px)); max-height: 86vh; overflow-y: auto; transform: translateY(100%); transition: transform .22s cubic-bezier(.32,.72,0,1); }
  .sheet-backdrop.open .sheet { transform: translateY(0); }
  .sheet h3 { font-family: var(--font-head); font-size: 19px; margin: 4px 0 18px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 7px; }
  .field input[type="text"], .field input[type="date"], .field select { width: 100%; font-size: 15px; padding: 11px 13px; border-radius: var(--radius-s); border: 1px solid var(--line); background: var(--surface-2); }
  .field input:focus, .field select:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
  .segmented { display: flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 100px; padding: 3px; }
  .segmented button { flex: 1; padding: 9px 4px; border-radius: 100px; font-size: 13.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
  .segmented button.active { background: var(--ink); color: var(--bg); }

  .photo-picker { display: flex; align-items: center; gap: 12px; }
  .photo-preview { width: 64px; height: 64px; border-radius: 16px; background: var(--surface-2); border: 1.5px dashed var(--line); display: flex; align-items: center; justify-content: center; color: var(--ink-faint); overflow: hidden; flex: 0 0 auto; background-size: cover; background-position: center; }
  .photo-preview.has-photo { border-style: solid; border-color: var(--line); }
  .photo-btns { display: flex; flex-direction: column; gap: 6px; }

  .cat-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .cat-pick { border-radius: 100px; border: 1.5px solid var(--line); background: var(--surface-2); font-size: 13px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
  .cat-pick.add { padding: 8px 13px; border-style: dashed; display: inline-flex; align-items: center; }
  .cat-pick.real { display: flex; align-items: stretch; padding: 0; overflow: hidden; }
  .cat-pick.real.sel { border-color: var(--ink); }
  .cat-pick-main { padding: 8px 6px 8px 13px; display: flex; align-items: center; gap: 6px; background: none; border: none; color: inherit; font: inherit; cursor: pointer; }
  .cat-pick.real.sel .cat-pick-main { color: var(--ink); }
  .cat-pick-edit { padding: 8px 12px 8px 8px; background: none; border: none; border-left: 1px solid var(--line); color: var(--ink-faint); display: flex; align-items: center; cursor: pointer; }
  .cat-pick .sw { width: 10px; height: 10px; border-radius: 50%; }

  .emoji-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .emoji-pick { width: 100%; aspect-ratio: 1; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .emoji-pick.sel { border-color: var(--ink); background: var(--surface-2); }
  .emoji-pick.custom input { width: 100%; height: 100%; border: none; background: none; text-align: center; font-size: 15px; padding: 0; }
  .emoji-pick input { width: 100%; height: 100%; text-align: center; background: none; border: none; font-size: 17px; padding: 0; }

  .newcat-form { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-s); }
  .newcat-form input[type="text"] { flex: 1; min-width: 0; font-size: 14px; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); }
  .newcat-form input[type="text"].nc-emoji { flex: 0 0 48px; text-align: center; padding: 9px 4px; }
  .newcat-form input[type="color"] { flex: 0 0 auto; width: 38px; height: 38px; padding: 0; border: none; border-radius: 9px; background: none; }
  .newcat-form button { flex: 0 0 auto; background: var(--ink); color: var(--bg); border-radius: 9px; padding: 9px 12px; font-size: 13px; font-weight: 700; }

  .quickdate-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .quickdate { padding: 8px 13px; border-radius: 100px; border: 1px solid var(--line); background: var(--surface-2); font-size: 13px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
  .quickdate.sel { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .weekday-row { display: flex; gap: 6px; }
  .weekday-pick { flex: 1; padding: 10px 0; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface-2); font-size: 12.5px; font-weight: 700; color: var(--ink-soft); cursor: pointer; text-align: center; }
  .weekday-pick.sel { border-color: var(--ink); background: var(--ink); color: var(--bg); }

  .sheet-submit { width: 100%; justify-content: center; padding: 13px; font-size: 15px; margin-top: 6px; }

  .sheet-handle { width: 36px; height: 5px; border-radius: 100px; background: var(--line); margin: 0 auto 14px; }

  .icon-trigger { display: flex; align-items: center; gap: 12px; }
  .icon-trigger-preview { width: 44px; height: 44px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 22px; flex: 0 0 auto; }
  .emoji-dropdown { margin-top: 10px; padding: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-s); max-height: 230px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
</style>
</head>
<body>
<div id="app">

  <header class="top"><h1>Tackle</h1></header>

  <main id="main"></main>

  <button class="fab" id="fabAdd" aria-label="Add task"></button>

</div>

<!-- Add task sheet -->
<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="sheetHeading">New Task</h3>
    <div class="field">
      <label>Title</label>
      <input type="text" id="f_title" placeholder="e.g. Clean the windows" maxlength="60">
    </div>
    <div class="field">
      <label>Photo</label>
      <div class="photo-picker">
        <div class="photo-preview" id="photoPreview"></div>
        <div class="photo-btns">
          <button type="button" class="btn btn-ghost btn-small" id="photoPickBtn">Choose photo</button>
          <button type="button" class="btn btn-ghost btn-small" id="photoRemoveBtn" style="display:none;">Remove</button>
        </div>
        <input type="file" accept="image/*" id="photoInput" style="display:none;">
      </div>
    </div>
    <div class="field" id="emojiField">
      <label>Icon</label>
      <div class="icon-trigger">
        <div class="icon-trigger-preview" id="iconTriggerPreview"></div>
        <button type="button" class="btn btn-ghost btn-small" id="iconPickBtn">Change icon</button>
      </div>
      <div class="emoji-dropdown" id="emojiDropdown" style="display:none;">
        <div class="emoji-row" id="emojiRow"></div>
      </div>
    </div>
    <div class="field">
      <label>Category</label>
      <div class="cat-row" id="catRow"></div>
      <div class="newcat-form" id="newCatForm" style="display:none;">
        <input type="text" id="nc_name" placeholder="Name" maxlength="24">
        <input type="color" id="nc_color" value="#3B6FC9">
        <button type="button" class="btn-icon warn" id="nc_delete" style="display:none;" title="Delete category">✕</button>
        <button type="button" id="nc_add">Add</button>
      </div>
    </div>
    <div class="field">
      <label>Type</label>
      <div class="segmented" id="typeSeg">
        <button type="button" data-type="once" class="active">Once</button>
        <button type="button" data-type="recurring">Recurring</button>
      </div>
    </div>
    <div class="field" id="onceDateField">
      <label>Date (optional)</label>
      <div class="quickdate-row" id="quickDateRow">
        <button type="button" class="quickdate" data-q="none">No date</button>
        <button type="button" class="quickdate" data-q="custom">Pick a date</button>
      </div>
      <input type="date" id="f_customdate" style="display:none;">
    </div>
    <div class="field" id="recurField" style="display:none;">
      <label>Which weekday?</label>
      <div class="weekday-row" id="weekdayRow"></div>
    </div>
    <button type="button" class="btn btn-ghost btn-small" id="sheetDeleteBtn" style="display:none; color:var(--rose); margin-bottom:10px;">Delete task</button>
    <button class="btn btn-primary sheet-submit" id="sheetSubmit">Save task</button>
  </div>
</div>

<!-- Date move sheet -->
<div class="sheet-backdrop" id="moveBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3>Move</h3>
    <div class="field">
      <div class="quickdate-row" id="moveQuickRow">
        <button type="button" class="quickdate" data-q="none">No date</button>
        <button type="button" class="quickdate" data-q="custom">Pick a date</button>
      </div>
      <input type="date" id="moveCustomDate" style="display:none;">
    </div>
    <button class="btn btn-primary sheet-submit" id="moveSubmit">Apply</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var ICONS = {
    plus: '<path d="M12 5v14M5 12h14"/>',
    check: '<circle cx="12" cy="12" r="8.5"/><path d="M8.3 12.3l2.4 2.4L15.8 9.4"/>',
    calendar: '<rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/>',
    trash: '<path d="M4.5 7h15M9.5 7V5a1.5 1.5 0 0 1 1.5-1.5h2A1.5 1.5 0 0 1 14.5 5v2M6.7 7l0.9 12.4A2 2 0 0 0 9.6 21.2h4.8a2 2 0 0 0 2-1.8L17.3 7"/>',
    undo: '<path d="M9 4 4 9l5 5"/><path d="M4 9h6a5 5 0 0 1 5 5v2"/>',
    camera: '<path d="M4 8.5A2 2 0 0 1 6 6.5h1.5l1-2h7l1 2H18a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8.5z"/><circle cx="12" cy="13" r="3.6"/>',
    dots: '<circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/>',
    chevron: '<path d="M6 9l6 6 6-6"/>',
    edit: '<path d="M4 20h4L18.5 9.5a2 2 0 0 0 0-2.8l-1.2-1.2a2 2 0 0 0-2.8 0L4 15.5V20"/><path d="M13.5 6.5l4 4"/>'
  };
  function icon(name, size, strokeW){
    var s = size || 20;
    return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(strokeW||1.7)+'" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||'')+'</svg>';
  }

  var WEEKDAYS = [ {v:1,l:"Mon"}, {v:2,l:"Tue"}, {v:3,l:"Wed"}, {v:4,l:"Thu"}, {v:5,l:"Fri"}, {v:6,l:"Sat"}, {v:0,l:"Sun"} ];
  var WEEKDAY_FULL = {0:"Sunday",1:"Monday",2:"Tuesday",3:"Wednesday",4:"Thursday",5:"Friday",6:"Saturday"};
  var EMOJI_SET = ["🧹","🧽","🧴","🧻","🪣","🧼","🚿","🪟","🍽️","🍳","🥘","☕","🧊","🫗","👕","🧦","🪡","🪴","🌱","🌻","🍃","🌳","🐝","🚽","🛁","🪒","🔧","🔨","🪛","🛠️","🔩","🪜","📦","🗄️","🧰","🗃️","🗑️","♻️","🐾","🐶","🐱","🐟","💡","🔌","📺","🛏️","🚪","🔑","📋","✅","⭐","🎯","📅","🧾","🕯️","🧯","🚗","🧵"];
  var DEFAULT_EMOJI = "🗒️";
  var FALLBACK_CAT = { id: null, name: "—", color: "#9AA2B4" };

  var STORE_KEY = "hearth_app_state_v1";
  var state = null;

  function todayISO(){ var d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function parseISO(s){ var p=s.split("-"); return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])); }
  function toISO(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function addDays(iso,n){ var d=parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
  function nextWeekdayISO(fromISO, weekday){
    var d = parseISO(fromISO);
    var day = d.getDay();
    var diff = (weekday - day + 7) % 7;
    d.setDate(d.getDate() + diff);
    return toISO(d);
  }
  function fmtDate(iso){
    if (!iso) return "";
    var d = parseISO(iso);
    var days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return days[d.getDay()] + ", " + months[d.getMonth()] + " " + d.getDate();
  }
  function isPast(iso){ return iso < todayISO(); }

  function load(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw){
        var parsed = JSON.parse(raw);
        if (!parsed.priorityOrder) parsed.priorityOrder = [];
        if (!parsed.categories) parsed.categories = [];
        return parsed;
      }
    } catch(e){ console.warn("Could not load data", e); }
    return { tasks: [], history: [], priorityOrder: [], categories: [] };
  }
  function save(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch(e){ console.warn("Could not save data (storage may be full)", e); }
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  state = load();
  var doneOpen = false;

  var main = document.getElementById("main");
  document.getElementById("fabAdd").innerHTML = icon("plus", 24, 2);

  function getCategory(id){
    var c = state.categories.find(function(x){ return x.id === id; });
    return c || FALLBACK_CAT;
  }
  function catSoftBg(color){ return "color-mix(in srgb, " + color + " 20%, var(--surface-2))"; }
  function catPhotoBg(color){ return "color-mix(in srgb, " + color + " 28%, var(--surface-2))"; }

  function bubbleContent(x){
    var cat = getCategory(x.category);
    if (x.photo) return { style: "background-image:url(" + x.photo + ");", inner: "" };
    return { style: "background:" + catSoftBg(cat.color) + ";", inner: x.emoji || DEFAULT_EMOJI };
  }

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  // ---------- card renderer ----------
  function card(x, opts){
    opts = opts || {};
    var isPrio = !!opts.prio;
    var isRecurring = x.type === "recurring";
    var cat = getCategory(x.category);
    var sub = cat.name;
    if (isRecurring) sub += " · every " + WEEKDAY_FULL[x.weekday];
    else if (x.scheduledDate) sub += " · " + fmtDate(x.scheduledDate);
    var overdue = opts.overdue || (x.scheduledDate && !isRecurring && isPast(x.scheduledDate));
    var draggable = opts.draggable;
    var dragAttrs = ' data-task-id="' + x.id + '"' + (draggable ? (' data-zone-item="' + opts.zone + '"') : "");
    var handle = draggable ? ('<div class="drag-handle" data-drag-id="' + x.id + '">' + icon("dots", 16, 1.8) + '</div>') : "";
    var doneAct = isRecurring ? "done-recurring" : "done-once";
    var actions =
      '<button class="btn-icon" data-act="' + doneAct + '" data-id="' + x.id + '" title="Done">' + icon("check",14,1.8) + '</button>' +
      '<button class="btn-icon" data-act="move" data-id="' + x.id + '" title="Date">' + icon("calendar",14,1.8) + '</button>' +
      '<button class="btn-icon warn" data-act="delete" data-id="' + x.id + '" title="Delete">' + icon("trash",14,1.8) + '</button>';

    var classes = "card" + (isPrio ? " prio" : "") + (x.photo ? " photo-card" : "");
    var borderStyle = isPrio ? (' style="border-color:' + cat.color + ';' + (x.photo ? "" : "") + '"') : "";

    if (x.photo){
      return '<div class="' + classes + '"' + dragAttrs + (isPrio ? ' style="border-color:' + cat.color + ';"' : '') + '>' +
        handle +
        '<div class="card-photo" style="background-image:url(' + x.photo + ');background-color:' + catPhotoBg(cat.color) + ';"></div>' +
        '<div class="card-scrim"></div>' +
        '<div class="card-text"><div class="c-title">' + esc(x.title) + '</div><div class="c-sub' + (overdue?' overdue':'') + '">' + sub + '</div></div>' +
        '<div class="card-actions">' + actions + '</div>' +
      '</div>';
    }
    var bc = bubbleContent(x);
    return '<div class="' + classes + '"' + dragAttrs + borderStyle + '>' +
      handle +
      '<div class="bubble" style="' + bc.style + '">' + bc.inner + '</div>' +
      '<div class="c-title">' + esc(x.title) + '</div>' +
      '<div class="c-sub' + (overdue?' overdue':'') + '">' + sub + '</div>' +
      '<div class="card-actions">' + actions + '</div>' +
    '</div>';
  }

  // ---------- render ----------
  function render(){
    var validIds = {};
    state.tasks.forEach(function(t){ if (t.type==="once" && t.status==="open") validIds[t.id] = true; });
    state.priorityOrder = state.priorityOrder.filter(function(id){ return validIds[id]; });

    var prioTasks = state.priorityOrder.map(function(id){ return state.tasks.find(function(t){ return t.id===id; }); }).filter(Boolean);
    var prioSet = {};
    state.priorityOrder.forEach(function(id){ prioSet[id] = true; });
    var backlog = state.tasks.filter(function(x){ return x.type==="once" && x.status==="open" && !prioSet[x.id]; })
      .sort(function(a,b){
        if (a.scheduledDate && b.scheduledDate) return a.scheduledDate.localeCompare(b.scheduledDate);
        if (a.scheduledDate) return -1;
        if (b.scheduledDate) return 1;
        return 0;
      });
    var recurring = state.tasks.filter(function(x){ return x.type==="recurring"; })
      .sort(function(a,b){ return a.nextDueDate.localeCompare(b.nextDueDate); });
    var history = state.history.slice().sort(function(a,b){ return b.completedDate.localeCompare(a.completedDate) || b.ts - a.ts; });

    var html = "";

    html += '<section class="block"><h2>Next Up <span class="count">' + prioTasks.length + '</span></h2>';
    html += '<div class="zone" data-zone="prio">';
    if (prioTasks.length){
      html += '<div class="grid">' + prioTasks.map(function(x){ return card(x, { prio: true, draggable: true, zone: "prio" }); }).join("") + '</div>';
    } else {
      html += '<div class="empty-prio"><p>Drag a task here from Tasks to work on it next.</p></div>';
    }
    html += '</div></section>';

    html += '<section class="block"><h2>Recurrent <span class="count">' + recurring.length + '</span></h2>';
    if (recurring.length){
      html += '<div class="grid">' + recurring.map(function(x){ return card(x, { overdue: x.nextDueDate <= todayISO() }); }).join("") + '</div>';
    } else {
      html += '<div class="empty-state"><p>No recurring tasks yet — like watering plants or taking out the bins.</p></div>';
    }
    html += '</section>';

    html += '<section class="block"><h2>Tasks <span class="count">' + backlog.length + '</span></h2>';
    html += '<div class="zone" data-zone="sammlung">';
    if (backlog.length){
      html += '<div class="grid">' + backlog.map(function(x){ return card(x, { draggable: true, zone: "sammlung" }); }).join("") + '</div>';
    } else {
      html += '<div class="empty-state"><p>No tasks yet. Tap + to add one.</p></div>';
    }
    html += '</div></section>';

    html += '<section class="block">' +
      '<button class="done-toggle' + (doneOpen?' open':'') + '" id="doneToggle"><span class="dt-label">Done <span class="count">(' + history.length + ')</span></span><span class="chevron">' + icon("chevron",18,2) + '</span></button>' +
      '<div class="done-content' + (doneOpen?' open':'') + '" id="doneContent">';
    if (history.length){
      var lastDate = null;
      html += '<div class="list">';
      history.forEach(function(e){
        if (e.completedDate !== lastDate){ html += '<div class="history-date">' + fmtDate(e.completedDate) + '</div>'; lastDate = e.completedDate; }
        var bc = bubbleContent(e);
        var cat = getCategory(e.category);
        html += '<div class="list-row"><div class="bubble" style="' + bc.style + '">' + bc.inner + '</div>' +
          '<div class="lr-main"><div class="lr-title">' + esc(e.title) + '</div><div class="lr-sub">' + cat.name + '</div></div>' +
          '<button class="btn-icon" data-act="reactivate" data-id="' + e.id + '" title="Reactivate">' + icon("undo",16,1.8) + '</button>' +
          '</div>';
      });
      html += '</div>';
    } else {
      html += '<div class="empty-state"><p>Nothing completed yet. What you check off lands here.</p></div>';
    }
    html += '</div></section>';

    main.innerHTML = html;
    bindActions();
    bindDragHandles();
    bindCardOpen();
    var toggle = document.getElementById("doneToggle");
    if (toggle) toggle.addEventListener("click", function(){ doneOpen = !doneOpen; render(); });
  }

  // ---------- actions ----------
  var moveTargetId = null;

  function bindActions(){
    main.querySelectorAll("[data-act]").forEach(function(el){
      el.addEventListener("click", function(){
        var act = el.dataset.act, id = el.dataset.id;
        if (act === "done-once") completeOnce(id);
        else if (act === "done-recurring") completeRecurring(id);
        else if (act === "delete") deleteTask(id);
        else if (act === "move") openMoveSheet(id);
        else if (act === "reactivate") reactivate(id);
      });
    });
  }

  function bindCardOpen(){
    main.querySelectorAll(".card[data-task-id]").forEach(function(el){
      el.addEventListener("click", function(e){
        if (e.target.closest("button") || e.target.closest(".drag-handle")) return;
        openEditSheet(el.dataset.taskId);
      });
    });
  }

  function findTask(id){ return state.tasks.find(function(t){ return t.id===id; }); }
  function removeFromPriority(id){
    var i = state.priorityOrder.indexOf(id);
    if (i > -1) state.priorityOrder.splice(i,1);
  }

  function completeOnce(id){
    var t = findTask(id);
    if (!t) return;
    t.status = "done";
    removeFromPriority(id);
    state.history.push({ id: uid(), taskId: t.id, title: t.title, photo: t.photo||null, emoji: t.emoji||DEFAULT_EMOJI, category: t.category, completedDate: todayISO(), ts: Date.now(), type: "once" });
    save(); render();
  }
  function completeRecurring(id){
    var t = findTask(id);
    if (!t) return;
    state.history.push({ id: uid(), taskId: t.id, title: t.title, photo: t.photo||null, emoji: t.emoji||DEFAULT_EMOJI, category: t.category, completedDate: todayISO(), ts: Date.now(), type: "recurring" });
    t.nextDueDate = nextWeekdayISO(addDays(todayISO(),1), t.weekday);
    save(); render();
  }
  function deleteTask(id){
    state.tasks = state.tasks.filter(function(t){ return t.id!==id; });
    removeFromPriority(id);
    save(); render();
  }
  function reactivate(historyId){
    var entry = state.history.find(function(h){ return h.id===historyId; });
    if (!entry) return;
    var task = entry.taskId ? findTask(entry.taskId) : null;
    if (task){
      if (task.type === "once"){ task.status = "open"; }
      else { task.nextDueDate = todayISO(); }
    } else if (entry.type === "once") {
      state.tasks.push({ id: uid(), title: entry.title, photo: entry.photo||null, emoji: entry.emoji||DEFAULT_EMOJI, category: entry.category, type: "once", status: "open", scheduledDate: null });
    }
    state.history = state.history.filter(function(h){ return h.id!==historyId; });
    save(); render();
  }

  // ---------- move sheet ----------
  var moveBackdrop = document.getElementById("moveBackdrop");
  var moveCustomDate = document.getElementById("moveCustomDate");
  var moveChoice = null;

  function openMoveSheet(id){
    moveTargetId = id;
    moveChoice = null;
    moveCustomDate.style.display = "none";
    moveCustomDate.value = "";
    document.querySelectorAll("#moveQuickRow .quickdate").forEach(function(b){ b.classList.remove("sel"); });
    moveBackdrop.classList.add("open");
  }
  document.getElementById("moveQuickRow").addEventListener("click", function(e){
    var b = e.target.closest(".quickdate");
    if (!b) return;
    document.querySelectorAll("#moveQuickRow .quickdate").forEach(function(x){ x.classList.remove("sel"); });
    b.classList.add("sel");
    moveChoice = b.dataset.q;
    moveCustomDate.style.display = moveChoice === "custom" ? "block" : "none";
    if (moveChoice === "custom" && !moveCustomDate.value) moveCustomDate.value = todayISO();
  });
  document.getElementById("moveSubmit").addEventListener("click", function(){
    var t = findTask(moveTargetId);
    if (t && moveChoice){
      if (moveChoice === "none") t.scheduledDate = null;
      else if (moveChoice === "custom" && moveCustomDate.value) t.scheduledDate = moveCustomDate.value;
      save();
    }
    moveBackdrop.classList.remove("open");
    render();
  });
  moveBackdrop.addEventListener("click", function(e){ if (e.target === moveBackdrop) moveBackdrop.classList.remove("open"); });

  // ---------- swipe-down-to-dismiss for sheets ----------
  function enableSheetDrag(backdropEl){
    var sheet = backdropEl.querySelector(".sheet");
    var startY = 0, currentY = 0, dragging = false;

    sheet.addEventListener("pointerdown", function(e){
      if (!e.target.closest(".sheet-handle") && !e.target.closest("h3")) return;
      dragging = true;
      startY = e.clientY;
      currentY = 0;
      sheet.style.transition = "none";
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
      document.addEventListener("pointercancel", onUp);
    });

    function onMove(e){
      if (!dragging) return;
      var dy = e.clientY - startY;
      if (dy < 0) dy = 0;
      currentY = dy;
      sheet.style.transform = "translateY(" + dy + "px)";
    }
    function onUp(){
      if (!dragging) return;
      dragging = false;
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
      var shouldClose = currentY > 120;
      requestAnimationFrame(function(){
        sheet.style.transition = "";
        requestAnimationFrame(function(){
          sheet.style.transform = "";
          if (shouldClose) backdropEl.classList.remove("open");
        });
      });
      currentY = 0;
    }
  }
  enableSheetDrag(moveBackdrop);

  // ---------- drag & drop ----------
  function bindDragHandles(){
    main.querySelectorAll(".drag-handle").forEach(function(handle){
      handle.addEventListener("pointerdown", onDragStart, { passive: false });
    });
  }

  function onDragStart(e){
    e.preventDefault();
    var handle = e.currentTarget;
    var taskId = handle.dataset.dragId;
    var sourceEl = handle.closest("[data-task-id]");
    if (!sourceEl) return;

    var rect = sourceEl.getBoundingClientRect();
    var clone = sourceEl.cloneNode(true);
    clone.classList.add("drag-clone");
    clone.style.position = "fixed";
    clone.style.width = rect.width + "px";
    clone.style.height = rect.height + "px";
    clone.style.left = rect.left + "px";
    clone.style.top = rect.top + "px";
    clone.style.margin = "0";
    clone.style.zIndex = "999";
    clone.style.pointerEvents = "none";
    clone.style.opacity = "0.95";
    clone.style.boxShadow = "0 14px 30px rgba(0,0,0,0.25)";
    document.body.appendChild(clone);
    sourceEl.style.opacity = "0.35";
    document.body.classList.add("dragging-active");

    var offsetX = e.clientX - rect.left;
    var offsetY = e.clientY - rect.top;
    var zones = Array.prototype.slice.call(document.querySelectorAll("[data-zone]"));

    function highlightZones(x, y){
      var elAt = document.elementFromPoint(x, y);
      var overZone = elAt ? elAt.closest("[data-zone]") : null;
      zones.forEach(function(z){ z.classList.toggle("drop-hover", z === overZone); });
      return overZone;
    }
    function move(ev){
      clone.style.left = (ev.clientX - offsetX) + "px";
      clone.style.top = (ev.clientY - offsetY) + "px";
      highlightZones(ev.clientX, ev.clientY);
    }
    function finish(ev){
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", finish);
      document.removeEventListener("pointercancel", cancel);
      var dropZoneEl = highlightZones(ev.clientX, ev.clientY);
      var dropZone = dropZoneEl ? dropZoneEl.dataset.zone : null;
      if (dropZone === "prio") insertIntoPriority(taskId, ev.clientY, dropZoneEl);
      else if (dropZone === "sammlung") removeFromPriority(taskId);
      cleanup();
      save();
      render();
    }
    function cancel(){
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", finish);
      document.removeEventListener("pointercancel", cancel);
      cleanup();
    }
    function cleanup(){
      clone.remove();
      document.body.classList.remove("dragging-active");
      zones.forEach(function(z){ z.classList.remove("drop-hover"); });
      var src = main.querySelector('[data-task-id="' + taskId + '"]');
      if (src) src.style.opacity = "";
    }

    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", finish);
    document.addEventListener("pointercancel", cancel);
  }

  function insertIntoPriority(taskId, pointerY, prioZoneEl){
    removeFromPriority(taskId);
    var items = Array.prototype.slice.call(prioZoneEl.querySelectorAll(".card.prio"));
    var insertIndex = state.priorityOrder.length;
    for (var i = 0; i < items.length; i++){
      var r = items[i].getBoundingClientRect();
      var mid = r.top + r.height / 2;
      if (pointerY < mid){
        var itemId = items[i].dataset.taskId;
        var idx = state.priorityOrder.indexOf(itemId);
        insertIndex = idx > -1 ? idx : state.priorityOrder.length;
        break;
      }
    }
    state.priorityOrder.splice(insertIndex, 0, taskId);
  }

  function renderEmojiRow(){
    iconTriggerPreview.textContent = formState.emoji || DEFAULT_EMOJI;

    EMOJI_SET.forEach(function(e){

  var ncDelete = document.getElementById("nc_delete");
  var ncAddBtn = document.getElementById("nc_add");
  var editingCategoryId = null;

  function openCategoryForm(existing){
    if (existing){
      editingCategoryId = existing.id;
      ncName.value = existing.name;
      ncColor.value = existing.color;
      ncAddBtn.textContent = "Save";
      ncDelete.style.display = "inline-flex";
    } else {
      editingCategoryId = null;
      ncName.value = ""; ncColor.value = "#3B6FC9";

  function renderCatRow(){
    catRow.innerHTML = "";
    state.categories.forEach(function(c){
      var wrap = document.createElement("div");
      wrap.className = "cat-pick real" + (formState.category === c.id ? " sel" : "");
      var mainBtn = document.createElement("button");
      mainBtn.type = "button"; mainBtn.className = "cat-pick-main";
      mainBtn.innerHTML = '<span class="sw" style="background:' + c.color + '"></span>' + esc(c.name);
      mainBtn.addEventListener("click", function(){
        formState.category = c.id;
        newCatForm.style.display = "none";
        editingCategoryId = null;
        renderCatRow();
      });
      var editBtn = document.createElement("button");
      editBtn.type = "button"; editBtn.className = "cat-pick-edit";
      editBtn.innerHTML = icon("edit", 13, 1.8);
      editBtn.addEventListener("click", function(){ openCategoryForm(c); });
      wrap.appendChild(mainBtn);
      wrap.appendChild(editBtn);

    var addBtn = document.createElement("button");
    addBtn.type = "button";
    addBtn.className = "cat-pick add";

      if (newCatForm.style.display === "flex" && editingCategoryId === null){
        newCatForm.style.display = "none";
      } else {
        openCategoryForm(null);
      }
    });
    catRow.appendChild(addBtn);

  document.getElementById("nc_add").addEventListener("click", function(){
    var name = ncName.value.trim();
    var color = ncColor.value || "#3B6FC9";
    if (!name){ ncName.focus(); return; }
    if (editingCategoryId){
      var c = state.categories.find(function(x){ return x.id === editingCategoryId; });
      if (c){ c.name = name; c.color = color; }
    } else {
      var nc = { id: uid(), name: name, color: color };
      state.categories.push(nc);
      formState.category = nc.id;
    }
    save();
    editingCategoryId = null;
    newCatForm.style.display = "none";
    renderCatRow();
  });

  ncDelete.addEventListener("click", function(){
    if (!editingCategoryId) return;
    if (window.confirm("Delete this category? Tasks using it will show as uncategorized.")){
      state.categories = state.categories.filter(function(c){ return c.id !== editingCategoryId; });
      if (formState.category === editingCategoryId){
        formState.category = state.categories.length ? state.categories[0].id : null;
      }
      save();
      editingCategoryId = null;
      newCatForm.style.display = "none";
      renderCatRow();

  });

  quickDateRow.addEventListener("click", function(e){

    if (!b) return;
    formState.dateChoice = b.dataset.q;
    quickDateRow.querySelectorAll(".quickdate").forEach(function(x){ x.classList.remove("sel"); });
    b.classList.add("sel");
    customDateInput.style.display = formState.dateChoice === "custom" ? "block" : "none";
    if (formState.dateChoice === "custom" && !customDateInput.value) customDateInput.value = todayISO();
  });

  function renderPhotoPreview(){
    if (formState.photo){
      photoPreview.style.backgroundImage = "url(" + formState.photo + ")";
      photoPreview.classList.add("has-photo");
      photoPreview.innerHTML = "";
      photoRemoveBtn.style.display = "inline-flex";
      photoPickBtn.textContent = "Change photo";
    } else {
      photoPreview.style.backgroundImage = "";
      photoPreview.classList.remove("has-photo");
      photoPreview.innerHTML = icon("camera", 22, 1.6);
      photoRemoveBtn.style.display = "none";
      photoPickBtn.textContent = "Choose photo";
    }
  }
  photoPickBtn.addEventListener("click", function(){ photoInput.click(); });
  photoRemoveBtn.addEventListener("click", function(){ formState.photo = null; renderPhotoPreview(); });
  photoInput.addEventListener("change", function(e){
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    resizeImage(file, 480, 0.72, function(dataUrl){ formState.photo = dataUrl; renderPhotoPreview(); }, function(){ console.warn("Could not process photo"); });
    photoInput.value = "";
  });
  function resizeImage(file, maxDim, quality, onDone, onError){
    try {
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          try {
            var w = img.width, h = img.height;
            var scale = Math.min(1, maxDim / Math.max(w, h));
            var cw = Math.max(1, Math.round(w * scale));
            var ch = Math.max(1, Math.round(h * scale));
            var canvas = document.createElement("canvas");
            canvas.width = cw; canvas.height = ch;
            var ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, cw, ch);
            onDone(canvas.toDataURL("image/jpeg", quality));
          } catch(err){ onError && onError(err); }
        };
        img.onerror = function(err){ onError && onError(err); };
        img.src = e.target.result;
      };
      reader.onerror = function(err){ onError && onError(err); };
      reader.readAsDataURL(file);
    } catch(err){ onError && onError(err); }
  }

  var editingTaskId = null;
  var editingOriginalWeekday = null;
  var sheetHeading = document.getElementById("sheetHeading");
  var sheetDeleteBtn = document.getElementById("sheetDeleteBtn");
  var sheetSubmitBtn = document.getElementById("sheetSubmit");

  function openAddSheet(){
    editingTaskId = null;
    sheetHeading.textContent = "New Task";
    sheetSubmitBtn.textContent = "Save task";
    sheetDeleteBtn.style.display = "none";
    document.getElementById("f_title").value = "";
    customDateInput.value = "";
    customDateInput.style.display = "none";
    formState = { category: state.categories.length ? state.categories[0].id : null, type: "once", dateChoice: "none", weekday: new Date().getDay(), photo: null, emoji: EMOJI_SET[0] };
    renderPhotoPreview();
    renderEmojiRow();
    emojiDropdown.style.display = "none";
    renderCatRow();
    newCatForm.style.display = state.categories.length ? "none" : "flex";
    editingCategoryId = null;
    typeSeg.querySelectorAll("button").forEach(function(b){ b.classList.toggle("active", b.dataset.type==="once"); });
    onceDateField.style.display = "block";
    recurField.style.display = "none";
    quickDateRow.querySelectorAll(".quickdate").forEach(function(x){ x.classList.toggle("sel", x.dataset.q==="none"); });
    weekdayRow.querySelectorAll(".weekday-pick").forEach(function(b,i){ b.classList.toggle("sel", WEEKDAYS[i].v === formState.weekday); });
    sheetBackdrop.classList.add("open");
    setTimeout(function(){ document.getElementById("f_title").focus(); }, 200);
  }

  function openEditSheet(taskId){
    var t = findTask(taskId);
    if (!t) return;
    editingTaskId = taskId;
    editingOriginalWeekday = t.type === "recurring" ? t.weekday : null;
    sheetHeading.textContent = "Edit Task";
    sheetSubmitBtn.textContent = "Save changes";
    sheetDeleteBtn.style.display = "inline-flex";
    document.getElementById("f_title").value = t.title;
    formState = {
      category: t.category,
      type: t.type,
      dateChoice: (t.type === "once" && t.scheduledDate) ? "custom" : "none",
      weekday: t.type === "recurring" ? t.weekday : new Date().getDay(),
      photo: t.photo || null,
      emoji: t.emoji || EMOJI_SET[0]
    };
    renderPhotoPreview();
    renderEmojiRow();
    emojiDropdown.style.display = "none";
    renderCatRow();
    newCatForm.style.display = "none";
    editingCategoryId = null;
    typeSeg.querySelectorAll("button").forEach(function(b){ b.classList.toggle("active", b.dataset.type===t.type); });
    onceDateField.style.display = t.type === "once" ? "block" : "none";
    recurField.style.display = t.type === "recurring" ? "block" : "none";
    customDateInput.value = (t.type === "once" && t.scheduledDate) ? t.scheduledDate : "";
    customDateInput.style.display = (t.type === "once" && t.scheduledDate) ? "block" : "none";
    quickDateRow.querySelectorAll(".quickdate").forEach(function(x){ x.classList.toggle("sel", x.dataset.q === formState.dateChoice); });
    weekdayRow.querySelectorAll(".weekday-pick").forEach(function(b,i){ b.classList.toggle("sel", WEEKDAYS[i].v === formState.weekday); });
    sheetBackdrop.classList.add("open");
  }

  document.getElementById("fabAdd").addEventListener("click", openAddSheet);
  sheetBackdrop.addEventListener("click", function(e){ if (e.target === sheetBackdrop) sheetBackdrop.classList.remove("open"); });

  sheetDeleteBtn.addEventListener("click", function(){
    if (!editingTaskId) return;
    if (window.confirm("Delete this task?")){
      deleteTask(editingTaskId);
      sheetBackdrop.classList.remove("open");
    }
  });

  document.getElementById("sheetSubmit").addEventListener("click", function(){
    var title = document.getElementById("f_title").value.trim();
    if (!title){ document.getElementById("f_title").focus(); return; }
    if (!formState.category){ ncName.focus(); newCatForm.style.display = "flex"; return; }

    if (editingTaskId){
      var existing = findTask(editingTaskId);
      if (!existing){ sheetBackdrop.classList.remove("open"); return; }
      existing.title = title;
      existing.photo = formState.photo || null;
      existing.emoji = formState.emoji || DEFAULT_EMOJI;
      existing.category = formState.category;
      existing.type = formState.type;
      if (formState.type === "once"){
        delete existing.weekday;
        delete existing.nextDueDate;
        existing.scheduledDate = (formState.dateChoice === "custom" && customDateInput.value) ? customDateInput.value : null;
      } else {
        var weekdayChanged = editingOriginalWeekday === null || editingOriginalWeekday !== formState.weekday;
        existing.weekday = formState.weekday;
        delete existing.scheduledDate;
        if (weekdayChanged || !existing.nextDueDate) existing.nextDueDate = nextWeekdayISO(todayISO(), formState.weekday);
      }
      save();
      sheetBackdrop.classList.remove("open");
      render();
      return;
    }

    var task = {
      id: uid(),
      title: title,
      photo: formState.photo || null,
      emoji: formState.emoji || DEFAULT_EMOJI,
      category: formState.category,
      type: formState.type,
      status: "open"
    };
    if (formState.type === "once"){
      task.scheduledDate = (formState.dateChoice === "custom" && customDateInput.value) ? customDateInput.value : null;
    } else {
      task.weekday = formState.weekday;
      task.nextDueDate = nextWeekdayISO(todayISO(), task.weekday);
    }
    state.tasks.push(task);
    save();
    sheetBackdrop.classList.remove("open");
    render();
  });

  render();

  enableSheetDrag(sheetBackdrop);
})();
</script>
</body>
</html>
